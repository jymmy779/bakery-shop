spring.application.name=bakery-shop
# 1. C?ng Server
server.port=8080

# 2. K?t n?i CSDL MySQL (Thay root/123456 theo tài kho?n MySQL máy b?n)
spring.datasource.url=jdbc:mysql://localhost:3306/bakery_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=sapassword
