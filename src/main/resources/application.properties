spring.application.name=bakery-shop
spring.profiles.default=dev

server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:20MB}

app.upload-dir=${UPLOAD_DIR:uploads}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.order-confirmation-enabled=${ORDER_CONFIRMATION_EMAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


app.payment.bank-id=MB
app.payment.bank-name=MBBank
app.payment.account-number=69810102005
app.payment.account-name=LUONG VIET THAI
app.payment.qr-template=compact2

# Cấu hình API Key của SePay (lấy trên my.sepay.vn)
app.sepay.api-key=bakery_wwwja_secret_key_2026
