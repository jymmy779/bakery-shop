spring.application.name=bakery-shop
spring.profiles.default=dev

server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:20MB}

app.upload-dir=${UPLOAD_DIR:uploads}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
