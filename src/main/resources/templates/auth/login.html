<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/layout :: head-meta('Đăng nhập')}"></th:block>
  <meta name="description" content="Đăng nhập vào LUNE Bakery để đặt bánh và theo dõi đơn hàng." />
</head>
<body>
  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
  <header th:replace="~{fragments/layout :: header(currentPage='auth')}"></header>

  <main class="standard-page">
    <div class="wrap" style="max-width: 520px;">
      <span class="eyebrow" style="margin-bottom:6px">WELCOME BACK</span>
      <h1 class="page-title">Rất vui gặp lại!</h1>

      <!-- Error / logout messages -->
      <div class="alert" th:if="${param.error}">
        Email hoặc mật khẩu không chính xác. Vui lòng thử lại.
      </div>
      <div class="alert success" th:if="${param.logout}">
        Bạn đã đăng xuất thành công.
      </div>
      <div class="alert success" th:if="${param.registered}">
        Tạo tài khoản thành công! Vui lòng đăng nhập.
      </div>

      <div class="panel">
        <!-- Auth tab switch -->
        <div class="auth-switch">
          <button class="active" type="button">Đăng nhập</button>
          <a th:href="@{/register}" style="display:flex;align-items:center;justify-content:center;padding:13px;font-weight:600;font-size:14px;color:#9a8982;">Đăng ký</a>
        </div>

        <form th:action="@{/login}" method="post" id="login-form" style="margin-top:4px">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"
                 th:if="${_csrf != null}" />

          <div class="field">
            <label for="login-email">Địa chỉ email</label>
            <input type="email" id="login-email" name="email"
                   placeholder="email@example.com"
                   autocomplete="email" required />
          </div>
          <div class="field">
            <label for="login-password">Mật khẩu</label>
            <input type="password" id="login-password" name="password"
                   placeholder="Mật khẩu của bạn"
                   autocomplete="current-password" required />
            <div style="text-align:right;margin-top:4px">
              <a th:href="@{/forgot-password}" class="inline-link" style="font-size:11px">Quên mật khẩu?</a>
            </div>
          </div>

          <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px">
            Đăng nhập
            <svg aria-hidden="true" style="width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round">
              <use href="#i-arrow"/>
            </svg>
          </button>
        </form>

        <div class="auth-bottom">
          Chưa có tài khoản?
          <a th:href="@{/register}" class="inline-link">Đăng ký ngay</a>
        </div>
      </div>
    </div>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
