<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quên mật khẩu | Lune Bakery</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #fff8f6; }
    .reset-card { width: min(100%, 480px); padding: 36px; border: 1px solid #f1ded8; border-radius: 18px; background: #fff; box-shadow: 0 12px 40px #5c25300d; }
    .reset-brand { color: #8b263e; font: 700 24px Georgia, serif; letter-spacing: .04em; }
    .reset-copy { color: #765c5c; line-height: 1.6; }
    .reset-field { display: grid; gap: 8px; margin-top: 20px; color: #43282e; font-weight: 600; }
    .reset-field input { width: 100%; min-height: 48px; padding: 0 14px; border: 1px solid #e7c9c4; border-radius: 9px; background: #fffdfc; }
    .reset-field input:focus { outline: 2px solid #8b263e33; border-color: #8b263e; }
    .reset-button { width: 100%; min-height: 48px; margin-top: 24px; border: 0; border-radius: 9px; color: white; background: #8b263e; font-weight: 700; cursor: pointer; }
    .reset-message { margin-top: 18px; padding: 12px 14px; border-radius: 9px; line-height: 1.5; }
    .reset-message.info { color: #435c35; background: #edf5e6; }
    .reset-message.error { color: #8b263e; background: #fff0ed; }
    .reset-error { color: #a11937; font-size: 13px; }
    .reset-back { display: block; margin-top: 20px; color: #8b263e; text-align: center; text-decoration: none; }
    .reset-steps { margin: 8px 0 22px; color: #9a7773; font-size: 13px; }
    @media (max-width: 520px) { .reset-card { padding: 26px 20px; } }
  </style>
</head>
<body>
<main class="reset-card">
  <div class="reset-brand">LUNE.</div>
  <p class="reset-steps" th:text="${step == 'email' ? 'Bước 1/3 · Xác minh email' : (step == 'otp' ? 'Bước 2/3 · Nhập mã xác minh' : 'Bước 3/3 · Tạo mật khẩu mới')}">Bước 1/3 · Xác minh email</p>
  <h1 th:text="${step == 'email' ? 'Quên mật khẩu?' : (step == 'otp' ? 'Nhập mã OTP' : 'Đặt mật khẩu mới')}">Quên mật khẩu?</h1>
  <p class="reset-copy" th:if="${step == 'email'}">Nhập email đã đăng ký. Nếu email thuộc tài khoản đang hoạt động, chúng tôi sẽ gửi mã xác minh.</p>
  <p class="reset-copy" th:if="${step == 'otp'}">Nhập mã 6 chữ số đã gửi đến email của bạn. Mã có hiệu lực trong 10 phút.</p>
  <p class="reset-copy" th:if="${step == 'reset'}">Tạo mật khẩu mới dài từ 8 đến 72 ký tự và xác nhận lại.</p>

  <div class="reset-message info" role="status" th:if="${notice}" th:text="${notice}"></div>
  <div class="reset-message error" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>

  <form method="post" th:action="@{/forgot-password/send-otp}" th:if="${step == 'email'}" th:object="${forgotPasswordRequest}">
    <label class="reset-field" for="reset-email">Email đăng ký
      <input autocomplete="email" id="reset-email" required th:field="*{email}" type="email">
    </label>
    <span class="reset-error" th:errors="*{email}" th:if="${#fields.hasErrors('email')}"></span>
    <button class="reset-button" type="submit">Gửi mã OTP</button>
  </form>

  <form method="post" th:action="@{/forgot-password/verify-otp}" th:if="${step == 'otp'}" th:object="${verifyOtpRequest}">
    <input th:field="*{email}" type="hidden">
    <label class="reset-field" for="reset-otp">Mã OTP
      <input autocomplete="one-time-code" id="reset-otp" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required th:field="*{otp}" type="text">
    </label>
    <span class="reset-error" th:errors="*{otp}" th:if="${#fields.hasErrors('otp')}"></span>
    <button class="reset-button" type="submit">Xác minh OTP</button>
  </form>
  <form method="post" th:action="@{/forgot-password/send-otp}" th:if="${step == 'otp'}">
    <input name="email" th:value="${verifyOtpRequest.email}" type="hidden">
    <button class="reset-button" style="margin-top: 10px; color: #8b263e; background: #fff0ed" type="submit">Gửi lại mã OTP</button>
  </form>

  <form method="post" th:action="@{/forgot-password/reset}" th:if="${step == 'reset'}" th:object="${resetPasswordRequest}">
    <input th:field="*{resetToken}" type="hidden">
    <label class="reset-field" for="new-password">Mật khẩu mới
      <input autocomplete="new-password" id="new-password" minlength="8" maxlength="72" required th:field="*{newPassword}" type="password">
    </label>
    <span class="reset-error" th:errors="*{newPassword}" th:if="${#fields.hasErrors('newPassword')}"></span>
    <label class="reset-field" for="confirm-password">Nhập lại mật khẩu mới
      <input autocomplete="new-password" id="confirm-password" required th:field="*{confirmPassword}" type="password">
    </label>
    <button class="reset-button" type="submit">Cập nhật mật khẩu</button>
  </form>

  <a class="reset-back" th:href="@{/login}">Quay lại đăng nhập</a>
</main>
</body>
</html>
