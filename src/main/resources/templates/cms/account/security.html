<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/cms-layout :: head('Bảo mật tài khoản')}"></head>
<body>
<th:block th:replace="~{fragments/cms-sidebar :: nav('profile')}"></th:block>
<main class="cms-page cms-accounts-page cms-profile-page">
  <div class="wrap cms-accounts-wrap cms-profile-wrap">
    <header class="cms-accounts-header">
      <div>
        <span class="cms-products-kicker">QUẢN TRỊ <span aria-hidden="true">/</span> BẢO MẬT</span>
        <h1>Đổi mật khẩu</h1>
        <p>Đặt mật khẩu mới để bảo vệ tài khoản đang dùng để truy cập CMS.</p>
      </div>
    </header>

    <div th:if="${successMessage}" class="toast show" role="status" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="toast show error" role="alert" th:text="${errorMessage}"></div>

    <section class="cms-accounts-panel cms-profile-card cms-security-card" aria-labelledby="cms-security-title">
      <div class="cms-accounts-panel__heading">
        <div>
          <h2 id="cms-security-title">Cập nhật mật khẩu</h2>
          <p>Mật khẩu mới cần có từ 8 đến 72 ký tự.</p>
        </div>
      </div>

      <form th:action="@{/cms/profile/security}" th:object="${changePasswordRequest}" method="post" class="cms-profile-form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="cms-form-errors cms-profile-form__errors" th:if="${#fields.hasErrors()}">
          <strong>Vui lòng kiểm tra lại thông tin:</strong>
          <ul><li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li></ul>
        </div>

        <div class="cms-profile-form__fields">
          <div class="cms-form-field">
            <label for="currentPassword">Mật khẩu hiện tại <span aria-hidden="true">*</span></label>
            <div class="cms-profile-password-field">
              <input id="currentPassword" th:field="*{currentPassword}" type="password" autocomplete="current-password" required>
              <button class="cms-password-toggle" type="button" data-password-toggle="currentPassword" data-password-label="mật khẩu hiện tại" aria-label="Hiện mật khẩu hiện tại">
                <svg data-eye-open viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg data-eye-closed viewBox="0 0 24 24" aria-hidden="true" hidden><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15.7 15.7 0 0 1-3 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.1 0 2.1-.2 3-.5"/></svg>
              </button>
            </div>
            <small class="field-error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></small>
          </div>

          <div class="cms-form-field">
            <label for="newPassword">Mật khẩu mới <span aria-hidden="true">*</span></label>
            <div class="cms-profile-password-field">
              <input id="newPassword" th:field="*{newPassword}" type="password" autocomplete="new-password" minlength="8" maxlength="72" required aria-describedby="new-password-hint">
              <button class="cms-password-toggle" type="button" data-password-toggle="newPassword" data-password-label="mật khẩu mới" aria-label="Hiện mật khẩu mới">
                <svg data-eye-open viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg data-eye-closed viewBox="0 0 24 24" aria-hidden="true" hidden><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15.7 15.7 0 0 1-3 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.1 0 2.1-.2 3-.5"/></svg>
              </button>
            </div>
            <small id="new-password-hint">Tối thiểu 8 ký tự.</small>
            <small class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></small>
          </div>

          <div class="cms-form-field cms-form-field--wide">
            <label for="confirmPassword">Nhập lại mật khẩu mới <span aria-hidden="true">*</span></label>
            <div class="cms-profile-password-field">
              <input id="confirmPassword" th:field="*{confirmPassword}" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
              <button class="cms-password-toggle" type="button" data-password-toggle="confirmPassword" data-password-label="mật khẩu nhập lại" aria-label="Hiện mật khẩu nhập lại">
                <svg data-eye-open viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg data-eye-closed viewBox="0 0 24 24" aria-hidden="true" hidden><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7s-1.1 2.1-3 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.1 0 2.1-.2 3-.5"/></svg>
              </button>
            </div>
            <small class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></small>
            <small class="field-error" th:if="${#fields.hasErrors('newPasswordConfirmed')}" th:errors="*{newPasswordConfirmed}"></small>
          </div>
        </div>

        <footer class="cms-profile-form__actions">
          <a class="cms-profile-secondary" th:href="@{/cms/profile}">Quay lại hồ sơ</a>
          <button class="cms-profile-primary" type="submit">Lưu mật khẩu mới</button>
        </footer>
      </form>
    </section>
  </div>
</main>
<th:block th:replace="~{fragments/cms-layout :: scripts}"></th:block>
<script>
  document.querySelectorAll("[data-password-toggle]").forEach((button) => {
    button.addEventListener("click", () => {
      const input = document.getElementById(button.dataset.passwordToggle);
      const eyeOpen = button.querySelector("[data-eye-open]");
      const eyeClosed = button.querySelector("[data-eye-closed]");
      if (!input || !eyeOpen || !eyeClosed) return;

      const showPassword = input.type === "password";
      input.type = showPassword ? "text" : "password";
      eyeOpen.hidden = showPassword;
      eyeClosed.hidden = !showPassword;
      button.setAttribute("aria-label", `${showPassword ? "Ẩn" : "Hiện"} ${button.dataset.passwordLabel}`);
    });
  });
</script>
</body>
</html>
