<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/cms-layout :: head('Hồ sơ tài khoản')}"></head>
<body>
<th:block th:replace="~{fragments/cms-sidebar :: nav('profile')}"></th:block>
<main class="cms-page">
  <div class="wrap cms-management-page">
    <section class="cms-panel cms-profile-panel">
      <div th:if="${successMessage}" class="toast show" role="status" th:text="${successMessage}"></div>
      <form th:action="@{/cms/profile}" th:object="${profileUpdateRequest}" method="post" class="cms-product-form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <header class="cms-profile-heading">
          <span class="eyebrow">CMS / TÀI KHOẢN</span>
          <h1 class="section-title">Hồ sơ <em>của tôi</em></h1>
          <p>Cập nhật thông tin tài khoản quản trị đang đăng nhập.</p>
        </header>
        <div class="cms-product-form__grid">
          <div class="cms-form-field">
            <label for="fullName">Họ và tên</label>
            <input id="fullName" th:field="*{fullName}" required maxlength="100" autocomplete="name">
            <small class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></small>
          </div>
          <div class="cms-form-field">
            <label for="phone">Số điện thoại</label>
            <input id="phone" th:field="*{phone}" required type="tel" autocomplete="tel">
            <small class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></small>
          </div>
          <div class="cms-form-field cms-form-field--wide">
            <label for="email">Email đăng nhập</label>
            <input id="email" th:value="${profile.email}" type="email" readonly>
          </div>
        </div>
        <div class="cms-form-actions cms-profile-actions">
          <a class="btn btn-plain" th:href="@{/cms/profile/security}">Đổi mật khẩu</a>
          <button class="btn btn-primary" type="submit">Lưu hồ sơ</button>
        </div>
      </form>
    </section>
  </div>
</main>
<th:block th:replace="~{fragments/cms-layout :: scripts}"></th:block>
</body>
</html>
