<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/cms-layout :: head('Quản lý sản phẩm')}"></head>
<body>
	<div th:replace="~{fragments/cms-layout :: header}"></div>
	<main class="cms-page">
		<div class="wrap">
			<header class="cms-top"><div><span class="eyebrow">CMS / CATALOG</span><h1 class="section-title">Quản lý <em>sản phẩm</em></h1></div></header>
			<div th:if="${successMessage}" class="toast show" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="toast show" th:text="${errorMessage}"></div>
			<div class="cms-card-layout">
				<section>
					<div class="cms-toolbar"><h2>Danh sách sản phẩm</h2><button class="btn btn-primary" type="button" onclick="openProductCreate()">+ Thêm sản phẩm</button></div>
					<h3 class="cms-filter-title">Lọc sản phẩm theo tên, danh mục và trạng thái bán</h3>
					<form class="cms-filter" method="get" th:action="@{/cms/products}"><input name="keyword" th:value="${keyword}" placeholder="Tìm theo tên sản phẩm"><select name="categoryId"><option value="">Tất cả danh mục</option><option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}" th:selected="${category.id == categoryId}"></option></select><select name="status"><option value="">Tất cả trạng thái</option><option value="SELLING" th:selected="${status != null and status.name() == 'SELLING'}">SELLING</option><option value="STOPPED" th:selected="${status != null and status.name() == 'STOPPED'}">STOPPED</option></select><button class="btn btn-plain" type="submit">Lọc</button></form>
					<div class="cms-card-grid">
						<button class="cms-item-card" type="button" th:each="product : ${products.content}"
								th:attr="data-id=${product.id},data-name=${product.name},data-description=${product.description},data-price=${product.price},data-stock=${product.stockQuantity},data-preparation=${product.preparationDays},data-category=${product.categoryId},data-status=${product.status}"
								onclick="selectProduct(this)">
							<span class="card-image"><img th:src="@{/assets/product-placeholder.svg}" th:alt="${product.name}"></span>
							<span class="card-copy"><span class="eyebrow" th:text="${product.categoryName}">Danh mục</span><h3 th:text="${product.name}">Tên bánh</h3><p class="card-price" th:text="${product.price} + ' đ'">0 đ</p><p th:text="'Tồn kho: ' + ${product.stockQuantity}">Tồn kho: 0</p><span class="product-status" th:classappend="${product.status.name() == 'SELLING'} ? ' selling' : ' stopped'" th:text="'Trạng thái: ' + ${product.status}">Trạng thái: SELLING</span></span>
						</button>
					</div>
					<nav class="pagination" th:if="${products.totalPages > 1}"><a class="small-button" th:if="${products.hasPrevious()}" th:href="@{/cms/products(page=${products.number - 1},keyword=${keyword},categoryId=${categoryId},status=${status})}">Trước</a><span th:text="${products.number + 1} + ' / ' + ${products.totalPages}">1 / 1</span><a class="small-button" th:if="${products.hasNext()}" th:href="@{/cms/products(page=${products.number + 1},keyword=${keyword},categoryId=${categoryId},status=${status})}">Sau</a></nav>
				</section>
				<aside class="cms-side-panel" id="product-sidebar" hidden>
					<h2 id="product-sidebar-title">Thêm sản phẩm</h2><p class="side-hint" id="product-sidebar-hint">Chọn một card để chỉnh sửa hoặc xóa sản phẩm.</p>
					<form method="post" enctype="multipart/form-data" th:action="@{/cms/products/add}" th:object="${createRequest}" id="product-create-form" data-confirm-message="Bạn có muốn thêm sản phẩm này không?">
						<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
						<label for="create-product-name">Tên sản phẩm</label><input id="create-product-name" th:field="*{name}" required>
						<label for="create-product-price">Giá (VNĐ)</label><input id="create-product-price" th:field="*{price}" type="number" min="1" step="1" required><div class="price-suggestions" id="create-price-suggestions" aria-live="polite"></div>
						<label for="create-product-stock">Tồn kho</label><input id="create-product-stock" th:field="*{stockQuantity}" type="number" min="0" required>
						<label for="create-product-preparation">Số ngày chuẩn bị</label><input id="create-product-preparation" th:field="*{preparationDays}" type="number" min="0" required>
						<label for="create-product-category">Danh mục</label><select id="create-product-category" th:field="*{categoryId}" required><option value="">Chọn danh mục</option><option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option></select>
						<label for="create-product-description">Mô tả sản phẩm</label><textarea id="create-product-description" th:field="*{description}" required></textarea>
						<label for="create-product-images">Hình ảnh sản phẩm</label><input id="create-product-images" th:field="*{images}" type="file" multiple accept="image/*"><button class="btn btn-primary" type="submit">Thêm sản phẩm</button>
					</form>
					<form method="post" enctype="multipart/form-data" action="/cms/products/update/0" id="product-update-form" hidden data-confirm-message="Bạn có muốn cập nhật sản phẩm này không?">
						<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
						<label for="product-name">Tên sản phẩm</label><input name="name" id="product-name" required>
						<label for="product-price">Giá (VNĐ)</label><input name="price" id="product-price" type="number" min="1" step="1" required><div class="price-suggestions" id="update-price-suggestions" aria-live="polite"></div>
						<label for="product-stock">Tồn kho</label><input name="stockQuantity" id="product-stock" type="number" min="0" required>
						<label for="product-preparation">Số ngày chuẩn bị</label><input name="preparationDays" id="product-preparation" type="number" min="0" required>
						<label for="product-category">Danh mục</label><select name="categoryId" id="product-category" required><option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option></select>
						<label for="product-status">Trạng thái bán</label><select name="status" id="product-status" required><option th:each="status : ${statuses}" th:value="${status}" th:text="${status}"></option></select>
						<label for="product-description">Mô tả sản phẩm</label><textarea name="description" id="product-description" required></textarea>
						<label for="product-new-images">Hình ảnh sản phẩm</label><input id="product-new-images" name="newImages" type="file" multiple accept="image/*"><button class="btn btn-primary" type="submit">Cập nhật sản phẩm</button><button class="btn btn-plain" type="button" onclick="duplicateProduct()">+ Thêm sản phẩm tương tự</button>
					</form>
					<form method="post" action="/cms/products/delete/0" id="product-delete-form" hidden data-confirm-message="Sản phẩm và ảnh liên quan sẽ bị xóa vĩnh viễn. Bạn có chắc chắn muốn tiếp tục?" data-confirm-danger="true"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn danger-action" type="submit">Xóa vĩnh viễn</button></form>
				</aside>
			</div>
		</div>
	</main>
	<div th:replace="~{fragments/cms-layout :: footer}"></div><div th:replace="~{fragments/cms-layout :: confirm-dialog}"></div><th:block th:replace="~{fragments/cms-layout :: scripts}"></th:block>
	<script>
		function updatePriceSuggestions(inputId, suggestionsId) { var input = document.getElementById(inputId); var suggestions = document.getElementById(suggestionsId); var value = Number(input.value); suggestions.innerHTML = ''; if (!Number.isFinite(value) || value <= 0) { return; } [100, 1000, 10000].forEach(function (multiplier) { var button = document.createElement('button'); button.type = 'button'; button.className = 'price-suggestion'; button.textContent = (value * multiplier).toLocaleString('vi-VN') + ' đ'; button.addEventListener('click', function () { input.value = value * multiplier; input.dispatchEvent(new Event('input', { bubbles: true })); }); suggestions.appendChild(button); }); }
		function openProductCreate() { document.getElementById('product-sidebar').hidden = false; document.getElementById('product-sidebar-title').textContent = 'Thêm sản phẩm'; document.getElementById('product-sidebar-hint').textContent = 'Nhập thông tin để tạo sản phẩm mới.'; document.getElementById('product-create-form').hidden = false; document.getElementById('product-update-form').hidden = true; document.getElementById('product-delete-form').hidden = true; }
		function selectProduct(card) { document.querySelectorAll('.cms-item-card').forEach(function (item) { item.classList.remove('selected'); }); card.classList.add('selected'); document.getElementById('product-sidebar').hidden = false; document.getElementById('product-sidebar-title').textContent = 'Chỉnh sửa sản phẩm'; document.getElementById('product-sidebar-hint').textContent = 'Cập nhật thông tin, trạng thái bán hoặc xóa sản phẩm đã chọn.'; document.getElementById('product-create-form').hidden = true; document.getElementById('product-update-form').hidden = false; document.getElementById('product-delete-form').hidden = false; document.getElementById('product-update-form').action = '/cms/products/update/' + card.dataset.id; document.getElementById('product-delete-form').action = '/cms/products/delete/' + card.dataset.id; document.getElementById('product-name').value = card.dataset.name; document.getElementById('product-price').value = card.dataset.price; document.getElementById('product-stock').value = card.dataset.stock; document.getElementById('product-preparation').value = card.dataset.preparation; document.getElementById('product-category').value = card.dataset.category; document.getElementById('product-status').value = card.dataset.status; document.getElementById('product-description').value = card.dataset.description || ''; }
		function duplicateProduct() { var updateName = document.getElementById('product-name').value.trim(); document.getElementById('create-product-name').value = updateName + '_copy'; document.getElementById('create-product-price').value = document.getElementById('product-price').value; document.getElementById('create-product-stock').value = document.getElementById('product-stock').value; document.getElementById('create-product-preparation').value = document.getElementById('product-preparation').value; document.getElementById('create-product-category').value = document.getElementById('product-category').value; document.getElementById('create-product-description').value = document.getElementById('product-description').value; document.getElementById('product-sidebar-title').textContent = 'Thêm sản phẩm'; document.getElementById('product-sidebar-hint').textContent = 'Đã sao chép thông tin sản phẩm. Bạn có thể chỉnh sửa trước khi thêm.'; document.getElementById('product-create-form').hidden = false; document.getElementById('product-update-form').hidden = true; document.getElementById('product-delete-form').hidden = true; document.getElementById('create-product-price').dispatchEvent(new Event('input', { bubbles: true })); }
		document.getElementById('create-product-price').addEventListener('input', function () { updatePriceSuggestions('create-product-price', 'create-price-suggestions'); });
		document.getElementById('product-price').addEventListener('input', function () { updatePriceSuggestions('product-price', 'update-price-suggestions'); });
	</script>
</body></html>
