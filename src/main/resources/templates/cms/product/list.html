<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/cms-layout :: head('Quản lý sản phẩm')}"></head>
<body>
<th:block th:replace="~{fragments/cms-sidebar :: nav('products')}"></th:block>
<main class="cms-page">
  <div class="wrap">
    <header class="cms-top">
      <div>
        <span class="eyebrow">CMS / CATALOG</span>
        <h1 class="section-title">Quản lý <em>sản phẩm</em></h1>
      </div>
      <a class="btn btn-primary" th:href="@{/cms/products/add}">+ Thêm sản phẩm</a>
    </header>

    <div th:if="${successMessage}" class="toast show" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="toast show error" th:text="${errorMessage}"></div>

    <section class="cms-panel">
      <div class="cms-toolbar">
        <h2>Danh sách sản phẩm</h2>
        <span th:text="${products.totalElements} + ' sản phẩm'">0 sản phẩm</span>
      </div>
      <form class="cms-filter" method="get" th:action="@{/cms/products}">
        <label class="cms-search-field">
          <span class="sr-only">Tra cứu theo tên sản phẩm</span>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="10.8" cy="10.8" r="6.8"></circle>
            <path d="m16 16 4.5 4.5"></path>
          </svg>
          <input type="search" name="keyword" th:value="${keyword}"
                 placeholder="Tra cứu tên sản phẩm..." aria-label="Tra cứu theo tên sản phẩm">
        </label>
        <select name="categoryId" aria-label="Lọc theo danh mục">
          <option value="">Tất cả danh mục</option>
          <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"
                  th:selected="${category.id == categoryId}"></option>
        </select>
        <select name="status" aria-label="Lọc theo trạng thái">
          <option value="">Tất cả trạng thái</option>
          <option value="SELLING" th:selected="${status != null and status.name() == 'SELLING'}">Đang bán</option>
          <option value="STOPPED" th:selected="${status != null and status.name() == 'STOPPED'}">Ngừng bán</option>
        </select>
        <button class="btn btn-plain" type="submit">Lọc</button>
      </form>

      <div class="cms-table-wrap">
        <table class="cms-table cms-product-table">
          <thead>
          <tr>
            <th>Ảnh</th>
            <th>Sản phẩm</th>
            <th>Danh mục</th>
            <th>Giá</th>
            <th>Tồn kho</th>
            <th>Trạng thái</th>
            <th>Thao tác</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="product : ${products.content}">
            <td>
              <div class="cms-image-carousel" th:attr="data-images=${product.imagePathsCsv}">
                <button class="image-arrow previous" type="button" aria-label="Ảnh trước"
                        th:if="${product.imagePaths.size() > 1}" onclick="moveProductImage(this, -1)">&#8249;</button>
                <img class="cms-product-thumb"
                     th:src="${product.primaryImagePath != null ? product.primaryImagePath : '/assets/product-placeholder.svg'}"
                     onerror="this.onerror=null;this.src='/assets/product-placeholder.svg';"
                     th:alt="${product.name}">
                <button class="image-arrow next" type="button" aria-label="Ảnh sau"
                        th:if="${product.imagePaths.size() > 1}" onclick="moveProductImage(this, 1)">&#8250;</button>
              </div>
            </td>
            <td class="cms-product-name">
              <strong th:text="${product.name}">Tên sản phẩm</strong>
              <span class="cms-badge" th:if="${product.badge != null}" th:switch="${product.badge.name()}">
                <span th:case="'NEW'">Mới</span>
                <span th:case="'BEST_SELLER'">Bán chạy</span>
                <span th:case="'LIMITED'">Giới hạn</span>
                <span th:case="'SEASONAL'">Theo mùa</span>
              </span>
              <small th:text="${product.description}">Mô tả</small>
            </td>
            <td th:text="${product.categoryName}">Danh mục</td>
            <td class="cms-product-number" th:text="${#numbers.formatInteger(product.price, 0, 'POINT')} + ' đ'">0 đ</td>
            <td class="cms-product-number" th:text="${product.stockQuantity}">0</td>
            <td>
              <form method="post" th:action="@{/cms/products/toggle-status/{id}(id=${product.id})}"
                    data-confirm-message="Bạn có chắc muốn thay đổi trạng thái sản phẩm này?">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="product-status" type="submit"
                        th:classappend="${product.status.name() == 'SELLING'} ? ' selling' : ' stopped'"
                        th:text="${product.status.name() == 'SELLING' ? 'Đang bán' : 'Ngừng bán'}">Đang bán</button>
              </form>
            </td>
            <td class="cms-actions">
              <a class="btn btn-plain" th:href="@{/cms/products/{id}/edit(id=${product.id})}">Sửa</a>
              <form method="post" th:action="@{/cms/products/delete/{id}(id=${product.id})}"
                    data-confirm-message="Bạn có chắc muốn xóa sản phẩm này?"
                    data-confirm-danger="true">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn danger-action" type="submit">Xóa</button>
              </form>
            </td>
          </tr>
          <tr th:if="${products.empty}">
            <td colspan="7" class="cms-table-empty">Không có sản phẩm phù hợp.</td>
          </tr>
          </tbody>
        </table>
      </div>
      <nav class="pagination cms-product-pagination" th:if="${products.totalPages > 1}" aria-label="Phân trang sản phẩm">
        <a class="small-button" th:if="${products.hasPrevious()}"
           th:href="@{/cms/products(page=${products.number - 1},keyword=${keyword},categoryId=${categoryId},status=${status})}">Trước</a>
        <span th:text="${products.number + 1 + ' / ' + products.totalPages}">1 / 1</span>
        <a class="small-button" th:if="${products.hasNext()}"
           th:href="@{/cms/products(page=${products.number + 1},keyword=${keyword},categoryId=${categoryId},status=${status})}">Sau</a>
      </nav>
    </section>
  </div>
</main>
<th:block th:replace="~{fragments/cms-layout :: scripts}"></th:block>
<div th:replace="~{fragments/cms-sidebar :: image-preview}"></div>
<th:block th:replace="~{fragments/cms-sidebar :: image-preview-script}"></th:block>
<script>
function moveProductImage(button, direction) {
  const carousel = button.parentElement;
  const image = carousel.querySelector('img');
  const paths = (carousel.dataset.images || '').split('|').filter(Boolean);
  if (paths.length < 2) return;
  const current = Number(carousel.dataset.index || 0);
  const next = (current + direction + paths.length) % paths.length;
  carousel.dataset.index = next;
  image.onerror = function () {
    image.onerror = null;
    image.src = '/assets/product-placeholder.svg';
  };
  image.src = paths[next];
}
</script>
</body>
</html>
