<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/layout :: head-meta('Quản lý sản phẩm')}" /></head>
<body>
	<div th:replace="~{fragments/layout :: header}"></div>
	<main class="cms-page">
		<div class="wrap">
			<header class="cms-top"><div><span class="eyebrow">CMS / CATALOG</span><h1 class="section-title">Quản lý <em>sản phẩm</em></h1></div></header>
			<div th:if="${successMessage}" class="toast show" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="toast show" th:text="${errorMessage}"></div>
			<div class="cms-card-layout">
				<section>
					<form class="cms-filter" method="get" th:action="@{/admin/products}"><input name="keyword" th:value="${keyword}" placeholder="Tìm theo tên sản phẩm"><select name="categoryId"><option value="">Tất cả danh mục</option><option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}" th:selected="${category.id == categoryId}"></option></select><button class="btn btn-plain" type="submit">Lọc</button></form>
					<div class="cms-card-grid">
						<button class="cms-item-card" type="button" th:each="product : ${products.content}"
								th:attr="data-id=${product.id},data-name=${product.name},data-description=${product.description},data-price=${product.price},data-stock=${product.stockQuantity},data-preparation=${product.preparationDays},data-category=${product.categoryId},data-status=${product.status}"
								onclick="selectProduct(this)">
							<span class="card-image"><img th:src="@{/assets/product-placeholder.svg}" th:alt="${product.name}"></span>
							<span class="card-copy"><span class="eyebrow" th:text="${product.categoryName}">Danh mục</span><h3 th:text="${product.name}">Tên bánh</h3><p class="card-price" th:text="${product.price} + ' đ'">0 đ</p><p th:text="'Tồn kho: ' + ${product.stockQuantity}">Tồn kho: 0</p></span>
						</button>
					</div>
					<nav class="pagination" th:if="${products.totalPages > 1}"><a class="small-button" th:if="${products.hasPrevious()}" th:href="@{/admin/products(page=${products.number - 1},keyword=${keyword},categoryId=${categoryId})}">Trước</a><span th:text="${products.number + 1} + ' / ' + ${products.totalPages}">1 / 1</span><a class="small-button" th:if="${products.hasNext()}" th:href="@{/admin/products(page=${products.number + 1},keyword=${keyword},categoryId=${categoryId})}">Sau</a></nav>
				</section>
				<aside class="cms-side-panel" id="product-sidebar">
					<h2 id="product-sidebar-title">Thêm sản phẩm</h2><p class="side-hint" id="product-sidebar-hint">Chọn một card để chỉnh sửa hoặc xóa sản phẩm.</p>
					<form method="post" enctype="multipart/form-data" th:action="@{/admin/products/add}" th:object="${createRequest}" id="product-create-form">
						<input th:field="*{name}" placeholder="Tên sản phẩm" required><input th:field="*{price}" type="number" min="1" step="0.01" placeholder="Giá" required><input th:field="*{stockQuantity}" type="number" min="0" placeholder="Tồn kho" required><input th:field="*{preparationDays}" type="number" min="0" placeholder="Ngày chuẩn bị" required><select th:field="*{categoryId}" required><option value="">Chọn danh mục</option><option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option></select><textarea th:field="*{description}" placeholder="Mô tả" required></textarea><input th:field="*{images}" type="file" multiple accept="image/*"><button class="btn btn-primary" type="submit">Thêm sản phẩm</button>
					</form>
					<form method="post" enctype="multipart/form-data" action="/admin/products/update/0" id="product-update-form" hidden>
						<input name="name" id="product-name" required><input name="price" id="product-price" type="number" min="1" step="0.01" required><input name="stockQuantity" id="product-stock" type="number" min="0" required><input name="preparationDays" id="product-preparation" type="number" min="0" required><select name="categoryId" id="product-category" required><option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option></select><select name="status" id="product-status" required><option th:each="status : ${statuses}" th:value="${status}" th:text="${status}"></option></select><textarea name="description" id="product-description" required></textarea><input name="newImages" type="file" multiple accept="image/*"><button class="btn btn-primary" type="submit">Cập nhật sản phẩm</button>
					</form>
					<form method="post" action="/admin/products/delete/0" id="product-delete-form" hidden><button class="btn danger-action" type="submit">Xóa / ngừng bán</button></form>
				</aside>
			</div>
		</div>
	</main>
	<div th:replace="~{fragments/layout :: footer}"></div><th:block th:replace="~{fragments/layout :: scripts}"></th:block>
	<script>
		function openProductCreate() { document.getElementById('product-create-form').hidden = false; document.getElementById('product-update-form').hidden = true; document.getElementById('product-delete-form').hidden = true; }
		function selectProduct(card) { document.querySelectorAll('.cms-item-card').forEach(function (item) { item.classList.remove('selected'); }); card.classList.add('selected'); document.getElementById('product-sidebar-title').textContent = 'Chỉnh sửa sản phẩm'; document.getElementById('product-sidebar-hint').textContent = 'Cập nhật thông tin hoặc xóa sản phẩm đã chọn.'; document.getElementById('product-create-form').hidden = true; document.getElementById('product-update-form').hidden = false; document.getElementById('product-delete-form').hidden = false; document.getElementById('product-update-form').action = '/admin/products/update/' + card.dataset.id; document.getElementById('product-delete-form').action = '/admin/products/delete/' + card.dataset.id; document.getElementById('product-name').value = card.dataset.name; document.getElementById('product-price').value = card.dataset.price; document.getElementById('product-stock').value = card.dataset.stock; document.getElementById('product-preparation').value = card.dataset.preparation; document.getElementById('product-category').value = card.dataset.category; document.getElementById('product-status').value = card.dataset.status; document.getElementById('product-description').value = card.dataset.description || ''; }
	</script>
</body></html>
		<form method="post" enctype="multipart/form-data" th:action="@{/admin/products/add}" th:object="${createRequest}">
			<input th:field="*{name}" placeholder="Tên sản phẩm" required><input th:field="*{price}" type="number" min="1" step="0.01" placeholder="Giá" required>
			<input th:field="*{stockQuantity}" type="number" min="0" placeholder="Tồn kho" required><input th:field="*{preparationDays}" type="number" min="0" placeholder="Ngày chuẩn bị" required>
			<select th:field="*{categoryId}" required><option value="">Chọn danh mục</option><option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option></select>
			<textarea th:field="*{description}" placeholder="Mô tả" required></textarea><input th:field="*{images}" type="file" multiple accept="image/*">
			<button class="btn btn-primary" type="submit">Thêm sản phẩm</button>
		</form>
		<table><thead><tr><th>Sản phẩm</th><th>Danh mục</th><th>Giá</th><th>Tồn kho</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
			<tbody><tr th:each="product : ${products.content}">
				<td th:text="${product.name}">Tên</td><td th:text="${product.categoryName}">Danh mục</td><td th:text="${product.price}">0</td><td th:text="${product.stockQuantity}">0</td><td th:text="${product.status}">SELLING</td>
				<td><form method="post" th:action="@{/admin/products/delete/{id}(id=${product.id})}"><button class="btn" type="submit">Xóa / ngừng bán</button></form></td>
			</tr></tbody>
		</table>
		<nav th:if="${products.totalPages > 1}"><a th:if="${products.hasPrevious()}" th:href="@{/admin/products(page=${products.number - 1},keyword=${keyword},categoryId=${categoryId})}">Trước</a> <span th:text="${products.number + 1} + ' / ' + ${products.totalPages}">1 / 1</span> <a th:if="${products.hasNext()}" th:href="@{/admin/products(page=${products.number + 1},keyword=${keyword},categoryId=${categoryId})}">Sau</a></nav>
	</main>
	<div th:replace="~{fragments/layout :: footer}"></div><th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body></html>
