<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/cms-layout :: head('Quản lý sản phẩm')}"></head>
<body>
<div th:replace="~{fragments/cms-layout :: header}"></div>
<main class="cms-page">
  <div class="wrap">
    <header class="cms-top">
      <div><span class="eyebrow">CMS / CATALOG</span><h1 class="section-title">Quản lý <em>sản phẩm</em></h1></div>
    </header>
    <div th:if="${successMessage}" class="toast show" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="toast show" th:text="${errorMessage}"></div>
    <div class="cms-catalog-layout">
    <section class="cms-panel">
      <div class="cms-toolbar">
        <h2>Danh sách sản phẩm</h2>
        <button class="btn btn-primary" type="button" onclick="openProductCreate()">+ Thêm sản phẩm</button>
      </div>
      <p class="cms-filter-title">Lọc sản phẩm theo tên, danh mục và trạng thái bán</p>
      <form class="cms-filter" method="get" th:action="@{/cms/products}">
        <input name="keyword" th:value="${keyword}" placeholder="Tên sản phẩm">
        <select name="categoryId"><option value="">Tất cả danh mục</option><option
            th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"
            th:selected="${category.id == categoryId}"></option></select>
        <select name="status"><option value="">Tất cả trạng thái</option><option value="SELLING"
            th:selected="${status != null and status.name() == 'SELLING'}">Đang bán</option><option value="STOPPED"
            th:selected="${status != null and status.name() == 'STOPPED'}">Ngừng bán</option></select>
        <button class="btn btn-plain" type="submit">Lọc</button>
      </form>
      <div class="cms-table-wrap">
        <table class="cms-table">
          <thead><tr><th>Ảnh</th><th>Sản phẩm</th><th>Danh mục</th><th>Giá</th><th>Tồn kho</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
          <tbody>
          <tr th:each="product : ${products.content}">
            <td><img class="cms-product-thumb" th:src="${product.primaryImagePath != null ? product.primaryImagePath : '/assets/product-placeholder.svg'}" th:alt="${product.name}"></td>
            <td><strong th:text="${product.name}">Tên sản phẩm</strong><br><small th:text="${product.description}">Mô tả</small></td>
            <td th:text="${product.categoryName}">Danh mục</td>
            <td th:text="${product.price} + ' đ'">0 đ</td>
            <td th:text="${product.stockQuantity}">0</td>
            <td><form method="post" th:action="@{/cms/products/toggle-status/{id}(id=${product.id})}"
                    data-confirm-message="Bạn có chắc muốn thay đổi trạng thái sản phẩm này?">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button class="product-status" type="submit"
                      th:classappend="${product.status.name() == 'SELLING'} ? ' selling' : ' stopped'"
                      th:text="${product.status.name() == 'SELLING' ? 'Đang bán' : 'Ngừng bán'}">Đang bán</button>
            </form></td>
            <td class="cms-actions">
              <button class="btn btn-plain" type="button" th:attr="data-product-id=${product.id},data-name=${product.name},data-description=${product.description},data-price=${product.price},data-stock=${product.stockQuantity},data-preparation=${product.preparationDays},data-category=${product.categoryId},data-status=${product.status},data-image=${product.primaryImagePath}" onclick="selectProduct(this)">Sửa</button>
              <form method="post" th:action="@{/cms/products/delete/{id}(id=${product.id})}" data-confirm-message="Bạn có chắc muốn xóa sản phẩm này?" data-confirm-danger="true"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn danger-action" type="submit">Xóa</button></form>
            </td>
          </tr>
          <tr th:if="${products.empty}"><td colspan="7">Không có sản phẩm phù hợp.</td></tr>
          </tbody>
        </table>
      </div>
      <nav class="pagination" th:if="${products.totalPages > 1}">
        <a class="small-button" th:if="${products.hasPrevious()}" th:href="@{/cms/products(page=${products.number - 1},keyword=${keyword},categoryId=${categoryId},status=${status})}">Trước</a>
        <span th:text="${products.number + 1 + ' / ' + products.totalPages}">1 / 1</span>
        <a class="small-button" th:if="${products.hasNext()}" th:href="@{/cms/products(page=${products.number + 1},keyword=${keyword},categoryId=${categoryId},status=${status})}">Sau</a>
      </nav>
    </section>
    <aside class="cms-side-panel" id="product-sidebar">
      <h2 id="product-sidebar-title">Thêm sản phẩm</h2>
      <form method="post" enctype="multipart/form-data" th:action="@{/cms/products/add}" th:object="${createRequest}" id="product-create-form" data-confirm-message="Bạn có muốn thêm sản phẩm này không?">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>Tên sản phẩm</label><input th:field="*{name}" required>
        <label>Giá (VNĐ)</label><input th:field="*{price}" type="number" min="1" required>
        <label>Tồn kho</label><input th:field="*{stockQuantity}" type="number" min="0" required>
        <label>Số ngày chuẩn bị</label><input th:field="*{preparationDays}" type="number" min="0" required>
        <label>Danh mục</label><select th:field="*{categoryId}" required><option value="">Chọn danh mục</option><option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option></select>
        <label>Mô tả</label><textarea th:field="*{description}" required></textarea>
        <label>Hình ảnh</label><input th:field="*{images}" type="file" multiple accept="image/*">
        <button class="btn btn-primary" type="submit">Thêm sản phẩm</button>
      </form>
      <form method="post" enctype="multipart/form-data" action="/cms/products/update/0" id="product-update-form" hidden data-confirm-message="Bạn có muốn cập nhật sản phẩm này không?">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>Tên sản phẩm</label><input name="name" id="product-name" required>
        <label>Giá (VNĐ)</label><input name="price" id="product-price" type="number" min="1" required>
        <label>Tồn kho</label><input name="stockQuantity" id="product-stock" type="number" min="0" required>
        <label>Số ngày chuẩn bị</label><input name="preparationDays" id="product-preparation" type="number" min="0" required>
        <label>Danh mục</label><select name="categoryId" id="product-category" required><option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option></select>
        <label>Trạng thái bán</label><select name="status" id="product-status" required><option value="SELLING">Đang bán</option><option value="STOPPED">Ngừng bán</option></select>
        <label>Mô tả</label><textarea name="description" id="product-description" required></textarea>
        <label>Ảnh mới</label><input name="newImages" type="file" multiple accept="image/*">
        <button class="btn btn-primary" type="submit">Cập nhật sản phẩm</button>
      </form>
    </aside>
    </div>
  </div>
</main>
<div th:replace="~{fragments/cms-layout :: footer}"></div>
<th:block th:replace="~{fragments/cms-layout :: scripts}"></th:block>
<script>
function openProductCreate() { document.getElementById('product-sidebar').hidden = false; document.getElementById('product-sidebar-title').textContent = 'Thêm sản phẩm'; document.getElementById('product-create-form').hidden = false; document.getElementById('product-update-form').hidden = true; }
function selectProduct(button) { document.getElementById('product-sidebar').hidden = false; document.getElementById('product-sidebar-title').textContent = 'Chỉnh sửa sản phẩm'; document.getElementById('product-create-form').hidden = true; document.getElementById('product-update-form').hidden = false; document.getElementById('product-update-form').action = '/cms/products/update/' + button.dataset.productId; document.getElementById('product-name').value = button.dataset.name; document.getElementById('product-price').value = button.dataset.price; document.getElementById('product-stock').value = button.dataset.stock; document.getElementById('product-preparation').value = button.dataset.preparation; document.getElementById('product-category').value = button.dataset.category; document.getElementById('product-status').value = button.dataset.status; document.getElementById('product-description').value = button.dataset.description || ''; }
</script>
</body>
</html>
