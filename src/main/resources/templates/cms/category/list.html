<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/layout :: head-meta('Quản lý danh mục')}" /></head>
<body>
	<div th:replace="~{fragments/layout :: header}"></div>
	<main class="cms-page">
		<div class="wrap">
			<header class="cms-top"><div><span class="eyebrow">CMS / CATALOG</span><h1 class="section-title">Quản lý <em>danh mục</em></h1></div></header>
			<div th:if="${successMessage}" class="toast show" th:text="${successMessage}"></div>
			<div th:if="${errorMessage}" class="toast show" th:text="${errorMessage}"></div>
			<div class="cms-card-layout">
				<section>
					<div class="cms-toolbar"><h2>Danh mục bánh</h2><button class="btn btn-primary" type="button" onclick="openCategoryCreate()">+ Thêm danh mục</button></div>
					<div class="cms-card-grid">
						<button class="cms-item-card" type="button" th:each="category : ${categories}"
								th:attr="data-id=${category.id},data-name=${category.name},data-description=${category.description}"
								onclick="selectCategory(this)">
							<span class="card-image"><span class="category-art">✿</span></span>
							<span class="card-copy"><span class="eyebrow" th:text="${category.active ? 'Đang hoạt động' : 'Tạm ẩn'}">Đang hoạt động</span><h3 th:text="${category.name}">Bánh kem</h3><p th:text="${category.description}">Mô tả danh mục</p></span>
						</button>
					</div>
				</section>
				<aside class="cms-side-panel" id="category-sidebar">
					<h2 id="category-sidebar-title">Thêm danh mục</h2><p class="side-hint" id="category-sidebar-hint">Chọn một card để chỉnh sửa hoặc xóa danh mục.</p>
					<form method="post" th:action="@{/admin/categories/add}" th:object="${categoryRequest}" id="category-create-form">
						<input th:field="*{name}" placeholder="Tên danh mục" required><textarea th:field="*{description}" placeholder="Mô tả danh mục"></textarea><button class="btn btn-primary" type="submit">Lưu danh mục</button>
					</form>
					<form method="post" action="/admin/categories/update/0" id="category-update-form" hidden>
						<input name="name" id="category-name" placeholder="Tên danh mục" required><textarea name="description" id="category-description" placeholder="Mô tả danh mục"></textarea><button class="btn btn-primary" type="submit">Cập nhật danh mục</button>
					</form>
					<form method="post" action="/admin/categories/delete/0" id="category-delete-form" hidden><button class="btn danger-action" type="submit">Xóa danh mục</button></form>
				</aside>
			</div>
		</div>
	</main>
	<div th:replace="~{fragments/layout :: footer}"></div><th:block th:replace="~{fragments/layout :: scripts}"></th:block>
	<script>
		function openCategoryCreate() { document.getElementById('category-sidebar-title').textContent = 'Thêm danh mục'; document.getElementById('category-sidebar-hint').textContent = 'Tạo một nhóm sản phẩm mới cho cửa hàng.'; document.getElementById('category-create-form').hidden = false; document.getElementById('category-update-form').hidden = true; document.getElementById('category-delete-form').hidden = true; }
		function selectCategory(card) { document.querySelectorAll('.cms-item-card').forEach(function (item) { item.classList.remove('selected'); }); card.classList.add('selected'); document.getElementById('category-sidebar-title').textContent = 'Chỉnh sửa danh mục'; document.getElementById('category-sidebar-hint').textContent = 'Cập nhật thông tin hoặc xóa danh mục đã chọn.'; document.getElementById('category-create-form').hidden = true; document.getElementById('category-update-form').hidden = false; document.getElementById('category-delete-form').hidden = false; document.getElementById('category-update-form').action = '/admin/categories/update/' + card.dataset.id; document.getElementById('category-delete-form').action = '/admin/categories/delete/' + card.dataset.id; document.getElementById('category-name').value = card.dataset.name; document.getElementById('category-description').value = card.dataset.description || ''; }
	</script>
</body></html>
		<table><thead><tr><th>Tên</th><th>Mô tả</th><th>Thao tác</th></tr></thead>
			<tbody><tr th:each="category : ${categories}">
				<form method="post" th:action="@{/admin/categories/update/{id}(id=${category.id})}">
					<td><input name="name" th:value="${category.name}" required></td>
					<td><input name="description" th:value="${category.description}"></td>
					<td><button class="btn" type="submit">Lưu</button></form>
						<form method="post" th:action="@{/admin/categories/delete/{id}(id=${category.id})}" style="display:inline"><button class="btn" type="submit">Xóa</button></form>
					</td>
			</tr></tbody>
		</table>
	</main>
	<div th:replace="~{fragments/layout :: footer}"></div><th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body></html>
