<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/cms-layout :: head('Quản lý danh mục')}"></head>
<body>
<th:block th:replace="~{fragments/cms-sidebar :: nav('categories')}"></th:block>
<main class="cms-page"><div class="wrap">
  <header class="cms-top">
    <div><span class="eyebrow">CMS / CATALOG</span><h1 class="section-title">Quản lý <em>danh mục</em></h1></div>
    <a class="btn btn-primary" th:href="@{/cms/categories/add}">+ Thêm danh mục</a>
  </header>
  <div th:if="${successMessage}" class="toast show" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="toast show error" th:text="${errorMessage}"></div>
  <section class="cms-panel">
    <div class="cms-toolbar"><h2>Danh sách danh mục</h2><span th:text="${categories.size()} + ' danh mục'">0 danh mục</span></div>
    <label class="cms-search-field cms-category-search">
      <span class="sr-only">Tra cứu theo tên danh mục</span>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="10.8" cy="10.8" r="6.8"></circle>
        <path d="m16 16 4.5 4.5"></path>
      </svg>
      <input type="search" id="category-search" placeholder="Tra cứu tên danh mục..."
             aria-label="Tra cứu theo tên danh mục" autocomplete="off">
    </label>
    <div class="cms-table-wrap"><table class="cms-table"><thead><tr><th>Tên danh mục</th><th>Mô tả</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
      <tbody><tr th:each="category : ${categories}" data-category-row>
        <td><strong th:text="${category.name}">Danh mục</strong></td><td th:text="${category.description}">Mô tả</td>
        <td><form method="post" th:action="@{/cms/categories/toggle-status/{id}(id=${category.id})}"
                data-confirm-message="Bạn có chắc muốn thay đổi trạng thái danh mục này?">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <button class="product-status" type="submit"
                  th:classappend="${category.active} ? ' selling' : ' stopped'"
                  th:text="${category.active ? 'Hoạt động' : 'Ngừng hoạt động'}">Hoạt động</button>
        </form></td>
        <td class="cms-actions">
          <a class="btn btn-plain" th:href="@{/cms/categories/{id}/edit(id=${category.id})}">Sửa</a>
          <form method="post" th:action="@{/cms/categories/delete/{id}(id=${category.id})}" data-confirm-message="Bạn có chắc muốn xóa danh mục này?" data-confirm-danger="true"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn danger-action" type="submit">Xóa</button></form>
        </td>
      </tr><tr th:if="${#lists.isEmpty(categories)}" data-category-empty><td colspan="4">Không có danh mục.</td></tr>
      <tr data-category-no-results hidden><td colspan="4">Không tìm thấy danh mục phù hợp.</td></tr></tbody>
    </table></div>
  </section>
</div></main>
<th:block th:replace="~{fragments/cms-layout :: scripts}"></th:block>
<script>
const categorySearch = document.getElementById('category-search');
categorySearch.addEventListener('input', function () {
  const normalize = value => value.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[đĐ]/g, 'd').toLocaleLowerCase('vi');
  const keyword = normalize(categorySearch.value.trim());
  const rows = document.querySelectorAll('[data-category-row]');
  let visibleRows = 0;
  rows.forEach(function (row) {
    const matches = normalize(row.cells[0].textContent).includes(keyword);
    row.hidden = !matches;
    if (matches) visibleRows++;
  });
  const emptyRow = document.querySelector('[data-category-empty]');
  const noResultsRow = document.querySelector('[data-category-no-results]');
  if (emptyRow) emptyRow.hidden = keyword.length > 0;
  noResultsRow.hidden = keyword.length > 0 && visibleRows === 0;
});
</script>
</body>
</html>
