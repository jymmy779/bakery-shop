<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/cms-layout :: head('Quản lý danh mục')}"></head>
<body>
	<div th:replace="~{fragments/cms-layout :: header}"></div>
	<main class="cms-page">
		<div class="wrap">
			<header class="cms-top"><div><span class="eyebrow">CMS / CATALOG</span><h1 class="section-title">Quản lý <em>danh mục</em></h1></div></header>
			<div th:if="${successMessage}" class="toast show" th:text="${successMessage}"></div>
			<div th:if="${errorMessage}" class="toast show" th:text="${errorMessage}"></div>
			<div class="cms-card-layout">
				<section>
					<div class="cms-toolbar"><h2>Danh mục bánh</h2><button class="btn btn-primary" type="button" onclick="openCategoryCreate()">+ Thêm danh mục</button></div>
					<div class="cms-card-grid">
						<button class="cms-item-card" type="button" th:each="category : ${categories}"
								th:attr="data-id=${category.id},data-name=${category.name},data-description=${category.description}"
								onclick="selectCategory(this)">
							<span class="card-image"><span class="category-art">✿</span></span>
							<span class="card-copy"><span class="eyebrow" th:text="${category.active ? 'Đang hoạt động' : 'Tạm ẩn'}">Đang hoạt động</span><h3 th:text="${category.name}">Bánh kem</h3><p th:text="${category.description}">Mô tả danh mục</p></span>
						</button>
					</div>
				</section>
				<aside class="cms-side-panel" id="category-sidebar" hidden>
					<h2 id="category-sidebar-title">Thêm danh mục</h2><p class="side-hint" id="category-sidebar-hint">Chọn một card để chỉnh sửa hoặc xóa danh mục.</p>
					<form method="post" th:action="@{/cms/categories/add}" th:object="${categoryRequest}" id="category-create-form" data-confirm-message="Bạn có muốn thêm danh mục này không?">
						<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
						<label for="create-category-name">Tên danh mục</label><input id="create-category-name" th:field="*{name}" required>
						<label for="create-category-description">Mô tả danh mục</label><textarea id="create-category-description" th:field="*{description}"></textarea><button class="btn btn-primary" type="submit">Lưu danh mục</button>
					</form>
					<form method="post" action="/cms/categories/update/0" id="category-update-form" hidden data-confirm-message="Bạn có muốn cập nhật danh mục này không?">
						<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
						<label for="category-name">Tên danh mục</label><input name="name" id="category-name" required>
						<label for="category-description">Mô tả danh mục</label><textarea name="description" id="category-description"></textarea><button class="btn btn-primary" type="submit">Cập nhật danh mục</button>
					</form>
					<form method="post" action="/cms/categories/delete/0" id="category-delete-form" hidden data-confirm-message="Danh mục sẽ bị xóa vĩnh viễn. Bạn có chắc chắn muốn tiếp tục?" data-confirm-danger="true"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn danger-action" type="submit">Xóa danh mục</button></form>
				</aside>
			</div>
		</div>
	</main>
	<div th:replace="~{fragments/cms-layout :: footer}"></div><div th:replace="~{fragments/cms-layout :: confirm-dialog}"></div><th:block th:replace="~{fragments/cms-layout :: scripts}"></th:block>
	<script>
		function openCategoryCreate() { document.getElementById('category-sidebar').hidden = false; document.getElementById('category-sidebar-title').textContent = 'Thêm danh mục'; document.getElementById('category-sidebar-hint').textContent = 'Tạo một nhóm sản phẩm mới cho cửa hàng.'; document.getElementById('category-create-form').hidden = false; document.getElementById('category-update-form').hidden = true; document.getElementById('category-delete-form').hidden = true; }
		function selectCategory(card) { document.querySelectorAll('.cms-item-card').forEach(function (item) { item.classList.remove('selected'); }); card.classList.add('selected'); document.getElementById('category-sidebar').hidden = false; document.getElementById('category-sidebar-title').textContent = 'Chỉnh sửa danh mục'; document.getElementById('category-sidebar-hint').textContent = 'Cập nhật thông tin hoặc xóa danh mục đã chọn.'; document.getElementById('category-create-form').hidden = true; document.getElementById('category-update-form').hidden = false; document.getElementById('category-delete-form').hidden = false; document.getElementById('category-update-form').action = '/cms/categories/update/' + card.dataset.id; document.getElementById('category-delete-form').action = '/cms/categories/delete/' + card.dataset.id; document.getElementById('category-name').value = card.dataset.name; document.getElementById('category-description').value = card.dataset.description || ''; }
	</script>
</body></html>
