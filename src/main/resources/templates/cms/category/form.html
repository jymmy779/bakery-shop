<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/cms-layout :: head(${isEdit ? 'Cập nhật danh mục' : 'Thêm danh mục'})}"></head>
<body>
<th:block th:replace="~{fragments/cms-sidebar :: nav('categories')}"></th:block>
<main class="cms-page">
  <div class="wrap">
    <header class="cms-top">
      <div>
        <span class="eyebrow">CMS / CATALOG / DANH MỤC</span>
        <h1 class="section-title" th:if="${isEdit}">Cập nhật <em>danh mục</em></h1>
        <h1 class="section-title" th:unless="${isEdit}">Thêm <em>danh mục</em></h1>
      </div>
      <a class="btn btn-plain" th:href="@{/cms/categories}">← Danh sách danh mục</a>
    </header>

    <section class="cms-panel cms-category-form-panel">
      <form class="cms-product-form" method="post" th:object="${categoryRequest}"
            th:action="${isEdit ? '/cms/categories/update/' + category.id : '/cms/categories/add'}"
            data-confirm-message="Bạn có muốn lưu thông tin danh mục này không?">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="cms-form-errors" th:if="${errorMessage}" th:text="${errorMessage}"></div>
        <div class="cms-form-errors" th:if="${#fields.hasErrors()}">
          <strong>Vui lòng kiểm tra lại thông tin:</strong>
          <ul>
            <li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li>
          </ul>
        </div>

        <section class="cms-form-section">
          <h2>Thông tin danh mục</h2>
          <div class="cms-product-form__grid">
            <div class="cms-form-field cms-form-field--wide">
              <label for="category-name">Tên danh mục</label>
              <input id="category-name" th:field="*{name}" maxlength="100" required>
              <small class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>
            </div>
            <div class="cms-form-field cms-form-field--wide">
              <label for="category-description">Mô tả</label>
              <textarea id="category-description" th:field="*{description}"></textarea>
              <small class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></small>
            </div>
          </div>
        </section>

        <div class="cms-form-actions">
          <a class="btn btn-plain" th:href="@{/cms/categories}">Hủy</a>
          <button class="btn btn-primary" type="submit"
                  th:text="${isEdit ? 'Lưu thay đổi' : 'Thêm danh mục'}">Lưu danh mục</button>
        </div>
      </form>
    </section>
  </div>
</main>
<th:block th:replace="~{fragments/cms-layout :: scripts}"></th:block>
</body>
</html>
