<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/cms-layout :: head-meta('Đăng nhập quản trị')}"></th:block>
</head>
<body class="cms-login-page">
  <main class="cms-login-shell">
    <aside th:replace="~{fragments/cms-layout :: login-brand}"></aside>

    <section class="cms-login-content">
      <div class="cms-login-card">
        <span class="cms-kicker">STAFF &amp; ADMIN PORTAL</span>
        <h2>Đăng nhập CMS</h2>
        <p class="cms-login-intro">Sử dụng tài khoản nhân viên hoặc quản trị viên để tiếp tục.</p>

        <div class="alert" th:if="${param.error}">
          Email hoặc mật khẩu không chính xác. Vui lòng thử lại.
        </div>
        <div class="alert" th:if="${param.roleError}">
          Tài khoản Customer không có quyền truy cập CMS.
        </div>
        <div class="alert success" th:if="${param.logout}">
          Bạn đã đăng xuất thành công.
        </div>

        <form th:action="@{/login}" method="post" id="cms-login-form">
          <input type="hidden" name="loginType" value="cms" />
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"
                 th:if="${_csrf != null}" />

          <div class="field">
            <label for="cms-email">Email nhân viên</label>
            <input type="email" id="cms-email" name="email" placeholder="staff@bakery.local"
                   autocomplete="email" required />
          </div>
          <div class="field">
            <label for="cms-password">Mật khẩu</label>
            <input type="password" id="cms-password" name="password" placeholder="Nhập mật khẩu"
                   autocomplete="current-password" required />
          </div>

          <button type="submit" class="btn btn-primary cms-submit">Đăng nhập CMS</button>
          <div class="cms-demo-actions">
            <button type="button" class="btn btn-demo" id="staff-demo-login">Staff demo</button>
            <button type="button" class="btn btn-demo" id="admin-demo-login">Admin demo</button>
          </div>
        </form>

        <a class="cms-back-link" th:href="@{/login}">← Đăng nhập với tư cách khách hàng</a>
      </div>
    </section>
  </main>

  <script>
    function submitDemoLogin(email, password) {
      document.getElementById('cms-email').value = email;
      document.getElementById('cms-password').value = password;
      document.getElementById('cms-login-form').requestSubmit();
    }

    document.getElementById('staff-demo-login')?.addEventListener('click', function () {
      submitDemoLogin('staff@bakery.local', 'staff123');
    });
    document.getElementById('admin-demo-login')?.addEventListener('click', function () {
      submitDemoLogin('admin@bakery.local', 'admin123');
    });
  </script>
</body>
</html>
