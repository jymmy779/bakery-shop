<!DOCTYPE html>

<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8" />
  <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <meta content="web_standard" name="shell-type" />
  <title>Bảo mật — LUNE Bakery</title>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&amp;family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&amp;display=swap"
    rel="stylesheet" />
  <style>
    @layer base {

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        overscroll-behavior: none;
      }

      main>:first-child {
        margin-top: 0 !important;
      }

      main>:last-child {
        margin-bottom: 0 !important;
      }
    }

    button {
      cursor: pointer;
    }

    ::-webkit-scrollbar {
      display: none;
    }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script th:src="@{/js/tailwind-config.js}" src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/local-icons.css">
  <script th:src="@{/js/local-icons.js}" src="/js/local-icons.js" defer></script>
</head>

<body
  class="bg-surface font-body-md text-on-surface antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
  <header th:replace="~{fragments/layout :: storefrontHeader('auth')}"></header>
  <main class="w-full pt-20 bg-surface">
    <div class="flex flex-col w-full">
      <div th:replace="~{fragments/layout :: storefrontBreadcrumb('Bảo mật', 'Tài khoản của tôi', '/profile')}"></div>
      <div class="relative w-full overflow-hidden">
        <!-- Main Container -->
        <div class="container py-space-lg">
          <!-- 2. Header: Greeting & Quick Summary Bento (Shared Component) -->
          <div th:replace="~{account/fragments :: accountHeader}"></div>
          <!-- 3. Layout: Two Columns (280px Sidebar + Content Canvas) -->
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-gutter items-start">
            <!-- ================= LEFT COLUMN: Sidebar Navigation (Shared Component) ================= -->
            <aside th:replace="~{account/fragments :: accountSidebar('security')}"></aside>
            <!-- ================= RIGHT COLUMN: Content Workspaces ================= -->
            <div class="lg:col-span-8 xl:col-span-9 space-y-space-xl">
              <section class="lg:col-span-8 xl:col-span-9 bg-surface-container-lowest rounded-xl p-space-lg shadow-sm">
                <div class="pb-space-md">
                  <h1 class="font-headline-sm text-headline-sm text-on-surface">Bảo mật</h1>
                  <p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Đổi mật khẩu định kỳ để bảo vệ tài
                    khoản của bạn.</p>
                </div>
                <div
                  class="rounded-lg bg-secondary-container px-space-md py-space-sm text-on-secondary-container mb-space-md"
                  th:if="${param.updated}" role="status">Mật khẩu đã được thay đổi thành công.</div>
                <div class="rounded-lg bg-error-container px-space-md py-space-sm text-on-error-container mb-space-md"
                  th:if="${passwordError}" th:text="${passwordError}" role="alert"></div>
                <form th:action="@{/profile/security}" th:object="${changePasswordRequest}" method="post"
                  class="space-y-space-md">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                  <div class="space-y-1">
                    <label class="block font-label-md text-label-md text-on-surface" for="currentPassword">Mật khẩu hiện
                      tại</label>
                    <div class="relative">
                      <input
                        class="w-full h-12 pl-space-md pr-12 bg-surface-container-lowest text-on-surface font-body-sm text-body-sm rounded-lg border border-outline-variant focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 shadow-sm"
                        id="currentPassword" th:field="*{currentPassword}" type="password"
                        autocomplete="current-password" required />
                      <button
                        class="absolute right-2 top-1/2 -translate-y-1/2 p-2 text-on-surface-variant hover:text-primary rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20"
                        type="button" data-password-toggle="currentPassword" data-password-label="mật khẩu hiện tại"
                        aria-label="Hiện mật khẩu hiện tại">
                        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">visibility_off</span>
                      </button>
                    </div>
                    <p class="font-body-sm text-error" th:if="${#fields.hasErrors('currentPassword')}"
                      th:errors="*{currentPassword}"></p>
                  </div>
                  <div class="space-y-1">
                    <label class="block font-label-md text-label-md text-on-surface" for="newPassword">Mật khẩu
                      mới</label>
                    <div class="relative">
                      <input
                        class="w-full h-12 pl-space-md pr-12 bg-surface-container-lowest text-on-surface font-body-sm text-body-sm rounded-lg border border-outline-variant focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 shadow-sm"
                        id="newPassword" th:field="*{newPassword}" type="password" autocomplete="new-password"
                        minlength="8" maxlength="72" placeholder="Tối thiểu 8 ký tự" required />
                      <button
                        class="absolute right-2 top-1/2 -translate-y-1/2 p-2 text-on-surface-variant hover:text-primary rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20"
                        type="button" data-password-toggle="newPassword" data-password-label="mật khẩu mới"
                        aria-label="Hiện mật khẩu mới">
                        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">visibility_off</span>
                      </button>
                    </div>
                    <p class="font-body-sm text-error" th:if="${#fields.hasErrors('newPassword')}"
                      th:errors="*{newPassword}"></p>
                  </div>
                  <div class="space-y-1">
                    <label class="block font-label-md text-label-md text-on-surface" for="confirmPassword">Nhập lại mật
                      khẩu mới</label>
                    <div class="relative">
                      <input
                        class="w-full h-12 pl-space-md pr-12 bg-surface-container-lowest text-on-surface font-body-sm text-body-sm rounded-lg border border-outline-variant focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 shadow-sm"
                        id="confirmPassword" th:field="*{confirmPassword}" type="password" autocomplete="new-password"
                        minlength="8" maxlength="72" required />
                      <button
                        class="absolute right-2 top-1/2 -translate-y-1/2 p-2 text-on-surface-variant hover:text-primary rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20"
                        type="button" data-password-toggle="confirmPassword" data-password-label="mật khẩu nhập lại"
                        aria-label="Hiện mật khẩu nhập lại">
                        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">visibility_off</span>
                      </button>
                    </div>
                    <p class="font-body-sm text-error" th:if="${#fields.hasErrors('confirmPassword')}"
                      th:errors="*{confirmPassword}"></p>
                    <p class="font-body-sm text-error" th:if="${#fields.hasErrors('newPasswordConfirmed')}"
                      th:errors="*{newPasswordConfirmed}"></p>
                  </div>
                  <div class="flex flex-wrap items-center justify-end gap-space-md pt-space-md"><a
                      class="px-space-lg py-2.5 rounded-full text-on-surface hover:bg-surface-container transition-colors font-label-md text-label-md"
                      th:href="@{/profile}">Quay lại hồ sơ</a><button
                      class="cursor-pointer px-space-xl py-2.5 rounded-full bg-primary hover:bg-primary-container text-on-primary transition-all shadow-sm font-label-md text-label-md flex items-center gap-2"
                      type="submit"><span class="material-symbols-outlined text-[18px]">done</span><span>Lưu mật khẩu
                        mới</span></button></div>
                </form>
              </section>
            </div>
          </div>
  </main>
  <th:block th:replace="~{fragments/layout :: storefrontUiComponents}"></th:block>
  <footer th:replace="~{fragments/layout :: storefrontFooter}"></footer>
  <script>
    document.querySelectorAll("[data-password-toggle]").forEach((button) => {
      button.addEventListener("click", () => {
        const input = document.getElementById(button.dataset.passwordToggle);
        const icon = button.querySelector(".material-symbols-outlined");
        if (!input || !icon) return;

        const showPassword = input.type === "password";
        input.type = showPassword ? "text" : "password";
        icon.textContent = showPassword ? "visibility" : "visibility_off";
        button.setAttribute("aria-label", `${showPassword ? "Ẩn" : "Hiện"} ${button.dataset.passwordLabel || "mật khẩu"}`);
      });
    });
  </script>
</body>

</html>
