<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3f1d26">
  <title th:text="${title} + ' — LUNE CMS'">LUNE CMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Playfair+Display:wght@500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<th:block th:fragment="head-meta(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3f1d26">
  <title th:text="${title} + ' — LUNE CMS'">LUNE CMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Playfair+Display:wght@500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</th:block>
<body class="cms-shell">
<div th:fragment="confirm-dialog" id="confirm-dialog" hidden>
  <div class="confirm-dialog__content">
    <p id="confirm-dialog-message"></p>
    <button type="button" data-confirm-cancel>Hủy</button>
    <button type="button" data-confirm-submit>Xác nhận</button>
  </div>
</div>
<th:block th:fragment="scripts">
  <script>
    (function () {
      var overlay;
      function show(text, kind) {
        if (!overlay) {
          overlay = document.createElement('div');
          overlay.className = 'cms-saving';
          overlay.setAttribute('role', 'status');
          overlay.innerHTML = '<i aria-hidden="true"></i><b></b>';
          document.body.appendChild(overlay);
        }
        overlay.hidden = false;
        overlay.className = 'cms-saving' + (kind ? ' ' + kind : '');
        overlay.querySelector('b').textContent = text;
      }
      function submitAjax(form) {
        var started = Date.now();
        var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
        show('Đang xử lý...');
        fetch(form.action, { method: 'POST', body: new FormData(form), credentials: 'same-origin' })
          .then(function (response) {
            return response.text().then(function (html) { return { response: response, html: html }; });
          })
          .then(function (result) {
            var doc = new DOMParser().parseFromString(result.html, 'text/html');
            var toast = doc.querySelector('.toast.show');
            if (!result.response.redirected && !toast) {
              document.open(); document.write(result.html); document.close();
              return null;
            }
            var failed = !result.response.ok || (toast && toast.classList.contains('error'));
            var text = toast ? toast.textContent.trim() : (failed ? 'Thao tác không thành công.' : 'Đã cập nhật thành công!');
            return wait(Math.max(0, 1000 - (Date.now() - started))).then(function () {
              show(text, failed ? 'error' : 'done');
              return wait(failed ? 2000 : 1200).then(function () { window.location.reload(); });
            });
          })
          .catch(function () {
            show('Không thể kết nối máy chủ. Vui lòng thử lại.', 'error');
            setTimeout(function () { overlay.hidden = true; }, 2500);
          });
      }
      document.querySelectorAll('form[data-confirm-message]').forEach(function (form) {
        form.addEventListener('submit', function (event) {
          if (!window.confirm(form.dataset.confirmMessage)) {
            event.preventDefault();
            return;
          }
          if (form.id !== 'product-form' && !event.defaultPrevented) {
            event.preventDefault();
            submitAjax(form);
          }
        });
      });
      document.querySelectorAll('.toast.show').forEach(function (toast) {
        setTimeout(function () { toast.classList.remove('show'); }, 4000);
      });
    })();
  </script>
</th:block>
<aside th:fragment="login-brand" class="cms-login-brand">
  <a th:href="@{/}" class="cms-brand-logo">LUNE<span>.</span></a>
  <div class="cms-brand-copy">
    <span class="cms-kicker">BAKERY MANAGEMENT</span>
    <h1>Vận hành tiệm bánh<br><em>gọn gàng mỗi ngày.</em></h1>
    <p>Khu vực làm việc dành riêng cho Staff và Admin của LUNE Bakery.</p>
  </div>
  <small>© 2026 LUNE Bakery</small>
</aside>
</body>
</html>
