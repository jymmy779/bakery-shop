<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="|${title} — LUNE Bakery|"></title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="stylesheet" th:href="@{/css/local-icons.css}"/>
  <link rel="stylesheet" th:href="@{/css/orders.css}"/>
  <link rel="stylesheet" th:href="@{/css/payment.css}"/>
  <script th:src="@{/js/local-icons.js}" defer></script>
  <script th:src="@{/js/payment.js}" defer></script>
</head>
<body>
  <span th:fragment="statusLabel(status)" th:switch="${status.name()}">
    <th:block th:case="'PENDING'">Chờ xử lý</th:block>
    <th:block th:case="'CONFIRMED'">Đã xác nhận</th:block>
    <th:block th:case="'DELIVERING'">Đang giao</th:block>
    <th:block th:case="'DELIVERED'">Đã giao</th:block>
    <th:block th:case="'CANCELLED'">Đã hủy</th:block>
  </span>
  <span th:fragment="statusBadge(status)" class="orders-status"
        th:classappend="|orders-status--${#strings.toLowerCase(status.name())}|">
    <span class="orders-status__dot" aria-hidden="true"></span>
    <span th:replace="~{order/fragments :: statusLabel(${status})}"></span>
  </span>
  <span th:fragment="paymentBadge(status)" class="orders-payment-status"
        th:classappend="${status != null and status.name() == 'PAID'} ? 'is-paid'">
    <th:block th:if="${status == null}">Chưa có thông tin thanh toán</th:block>
    <th:block th:if="${status != null}" th:text="${status.name() == 'PAID'} ? 'Đã thanh toán' : 'Chờ thanh toán'"></th:block>
  </span>
</body>
</html>
