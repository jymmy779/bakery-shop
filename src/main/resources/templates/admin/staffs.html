<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/layout :: head-meta('Quản lý nhân viên')}" />
</head>
<body>
  <div th:replace="~{fragments/layout :: header}"></div>
  <main class="cms-page">
    <div class="wrap">
      <header class="cms-top">
        <div>
          <span class="eyebrow">CMS / ACCOUNT</span>
          <h1 class="section-title">Quản lý <em>nhân viên</em></h1>
        </div>
      </header>
      <div th:if="${successMessage}" class="toast show" th:text="${successMessage}"></div>
      <div th:if="${errorMessage}" class="toast show" th:text="${errorMessage}"></div>
      <div class="validation-alert" th:if="${validationErrors != null and !validationErrors.isEmpty()}" role="alert">
        <strong>Dữ liệu chưa hợp lệ</strong>
        <ul>
          <li th:each="validationError : ${validationErrors}" th:text="${validationError}"></li>
        </ul>
      </div>
      <div class="cms-card-layout">
        <section>
          <div class="cms-toolbar">
            <h2>Danh sách nhân viên</h2>
          </div>
          <form class="cms-filter" method="get" th:action="@{/admin/staffs}">
            <label for="staff-keyword">Tìm theo email hoặc họ tên</label>
            <input id="staff-keyword" name="keyword" th:value="${keyword}"
                   placeholder="Nhập email hoặc họ tên">
            <button class="btn btn-plain" type="submit">Tìm kiếm</button>
          </form>
          <div class="staff-card-grid">
            <article class="staff-card" th:each="staff : ${staffs.content}">
          <div class="staff-card-header">
            <div>
              <span class="eyebrow">Nhân viên</span>
              <h2 th:text="${staff.fullName}">Nhân viên</h2>
            </div>
            <span class="staff-status" th:classappend="${staff.status.name() == 'ACTIVE'} ? ' active' : ' locked'"
                  th:text="${staff.status}">ACTIVE</span>
          </div>
          <div class="staff-card-details">
            <p><strong>Email</strong><span th:text="${staff.email}">staff@example.com</span></p>
            <p><strong>Số điện thoại</strong><span th:text="${staff.phone}">0900000000</span></p>
          </div>
          <form class="staff-update-form" method="post"
                th:action="@{/admin/staffs/update/{id}(id=${staff.id})}"
                data-confirm-message="Bạn có chắc muốn cập nhật thông tin nhân viên này không?">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label th:for="'staff-name-' + ${staff.id}">Họ tên</label>
            <input th:id="'staff-name-' + ${staff.id}" name="fullName"
                   th:value="${staff.fullName}" required>
            <label th:for="'staff-phone-' + ${staff.id}">Số điện thoại</label>
            <input th:id="'staff-phone-' + ${staff.id}" name="phone"
                   th:value="${staff.phone}" required>
            <button class="btn btn-plain" type="submit">Sửa nhân viên</button>
          </form>
          <form method="post" th:action="@{/admin/staffs/toggle-status/{id}(id=${staff.id})}"
                th:attr="data-confirm-message=${staff.status.name() == 'ACTIVE' ? 'Tài khoản sẽ bị khóa. Bạn có chắc muốn tiếp tục không?' : 'Tài khoản sẽ được mở khóa. Bạn có chắc muốn tiếp tục không?'}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn staff-status-button" type="submit"
                    th:text="${staff.status.name() == 'ACTIVE' ? 'Khóa tài khoản' : 'Mở khóa tài khoản'}">
              Khóa tài khoản
            </button>
          </form>
            </article>
            <p class="staff-empty" th:if="${staffs.empty}">Chưa có nhân viên phù hợp.</p>
          </div>
          <nav class="pagination" th:if="${staffs.totalPages > 1}">
            <a class="small-button" th:if="${staffs.hasPrevious()}"
               th:href="@{/admin/staffs(page=${staffs.number - 1},keyword=${keyword})}">Trước</a>
            <span th:text="${staffs.number + 1} + ' / ' + ${staffs.totalPages}">1 / 1</span>
            <a class="small-button" th:if="${staffs.hasNext()}"
               th:href="@{/admin/staffs(page=${staffs.number + 1},keyword=${keyword})}">Sau</a>
          </nav>
        </section>
        <aside class="cms-side-panel cms-staff-create" id="staff-sidebar">
          <h2>Thêm nhân viên</h2>
          <p class="side-hint">Nhập thông tin để tạo tài khoản nhân viên mới.</p>
          <form method="post" th:action="@{/admin/staffs/add}" th:object="${createRequest}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label for="staff-full-name">Họ tên</label>
            <input id="staff-full-name" th:field="*{fullName}" required>
            <label for="staff-email">Email</label>
            <input id="staff-email" type="email" th:field="*{email}" required>
            <label for="staff-phone">Số điện thoại</label>
            <input id="staff-phone" th:field="*{phone}" required>
            <label for="staff-password">Mật khẩu</label>
            <input id="staff-password" type="password" th:field="*{password}" required>
            <button class="btn btn-primary" type="submit">Thêm nhân viên</button>
          </form>
        </aside>
      </div>
    </div>
  </main>
  <div th:replace="~{fragments/layout :: footer}"></div>
  <div th:replace="~{fragments/layout :: confirm-dialog}"></div>
  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
