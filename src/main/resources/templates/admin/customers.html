<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/layout :: head-meta('Quản lý khách hàng')}" />
</head>
<body>
  <div th:replace="~{fragments/layout :: header}"></div>
  <main class="cms-page">
    <div class="wrap">
      <header class="cms-top">
        <div>
          <span class="eyebrow">CMS / ACCOUNT</span>
          <h1 class="section-title">Quản lý <em>khách hàng</em></h1>
        </div>
      </header>
      <div th:if="${successMessage}" class="toast show" th:text="${successMessage}"></div>
      <div th:if="${errorMessage}" class="toast show" th:text="${errorMessage}"></div>
      <form class="cms-filter" method="get" th:action="@{/admin/customers}">
        <label for="customer-keyword">Tìm theo email hoặc họ tên</label>
        <input id="customer-keyword" name="keyword" th:value="${keyword}"
               placeholder="Nhập email hoặc họ tên">
        <button class="btn btn-plain" type="submit">Tìm kiếm</button>
      </form>
      <div class="cms-table-wrap">
        <table class="cms-table">
          <thead>
          <tr><th>Họ tên</th><th>Email</th><th>Số điện thoại</th><th>Trạng thái</th><th>Thao tác</th></tr>
          </thead>
          <tbody>
          <tr th:each="customer : ${customers.content}">
            <td th:text="${customer.fullName}">Khách hàng</td>
            <td th:text="${customer.email}">customer@example.com</td>
            <td th:text="${customer.phone}">0900000000</td>
            <td><span th:text="${customer.status}">ACTIVE</span></td>
            <td>
              <form method="post" th:action="@{/admin/customers/toggle-status/{id}(id=${customer.id})}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-plain" type="submit"
                        th:text="${customer.status.name() == 'ACTIVE' ? 'Khóa' : 'Mở khóa'}">Khóa</button>
              </form>
            </td>
          </tr>
          <tr th:if="${customers.empty}"><td colspan="5">Chưa có tài khoản khách hàng phù hợp.</td></tr>
          </tbody>
        </table>
      </div>
      <nav class="pagination" th:if="${customers.totalPages > 1}">
        <a class="small-button" th:if="${customers.hasPrevious()}"
           th:href="@{/admin/customers(page=${customers.number - 1},keyword=${keyword})}">Trước</a>
        <span th:text="${customers.number + 1} + ' / ' + ${customers.totalPages}">1 / 1</span>
        <a class="small-button" th:if="${customers.hasNext()}"
           th:href="@{/admin/customers(page=${customers.number + 1},keyword=${keyword})}">Sau</a>
      </nav>
    </div>
  </main>
  <div th:replace="~{fragments/layout :: footer}"></div>
  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
