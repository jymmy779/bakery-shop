  <body
    class="bg-surface font-body-md text-on-surface antialiased selection:bg-primary-fixed selection:text-on-primary-fixed"
  >
    <header
      th:replace="~{fragments/layout :: storefrontHeader('products')}"
    ></header>
    <main class="w-full pt-20 bg-surface">
      <div th:replace="~{fragments/layout :: storefrontBreadcrumb('Giỏ hàng', null, null)}"></div>
      <section class="max-w-[1280px] mx-auto px-gutter py-space-xl">
        <h1 class="font-headline-lg text-headline-lg mb-space-md">Giỏ hàng của bạn</h1>
        <p id="cart-feedback" role="status" aria-live="polite" class="mb-space-md text-primary"></p>
        <div id="cart-empty" th:style="${cart.items.isEmpty() ? '' : 'display:none'}" class="rounded-xl bg-white p-space-xl text-center">
          <p class="font-headline-sm text-headline-sm mb-space-md">Giỏ hàng đang trống.</p>
          <a href="/products" class="inline-block px-space-lg py-space-md rounded-xl bg-primary-container text-on-primary">Chọn bánh</a>
        </div>
        <div id="cart-content" th:style="${cart.items.isEmpty() ? 'display:none' : ''}" class="grid grid-cols-1 lg:grid-cols-12 gap-space-lg items-start">
          <div id="cart-items" class="lg:col-span-8 space-y-space-md">
            <article th:each="item : ${cart.items}" th:attr="data-product-id=${item.productId}"
                     class="cart-item bg-white rounded-xl p-space-md flex flex-wrap gap-space-md items-center shadow-sm">
              <a th:href="@{/products/{id}(id=${item.productId})}" class="w-24 h-24 shrink-0 rounded-lg overflow-hidden bg-surface-container">
                <img class="w-full h-full object-cover" th:alt="${item.productName}"
                     th:src="${item.imagePath != null ? item.imagePath : '/assets/product-placeholder.svg'}"
                     onerror="this.onerror=null;this.src='/assets/product-placeholder.svg'"/>
              </a>
              <div class="flex-1 min-w-[180px]">
                <h2 class="font-headline-sm text-headline-sm"><a th:href="@{/products/{id}(id=${item.productId})}" th:text="${item.productName}"></a></h2>
                <p class="text-body-sm"><span data-unit-price th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'POINT', 0, 'COMMA')}"></span> ₫ / sản phẩm</p>
                <p class="text-body-sm">Tồn kho: <span data-stock th:text="${item.availableStock}"></span></p>
                <p data-availability th:text="${item.availabilityMessage}" class="text-primary text-body-sm" role="alert"></p>
                <div class="flex gap-space-sm items-center mt-space-sm">
                  <button type="button" data-action="decrease" aria-label="Giảm số lượng" class="px-3 py-1 rounded-lg bg-surface-container"
                          th:disabled="${item.quantity <= 1 or item.availableStock < 1}">−</button>
                  <input type="number" min="1" th:max="${item.availableStock}" th:value="${item.quantity}"
                         th:attr="data-current-quantity=${item.quantity}" th:disabled="${item.availableStock < 1}"
                         aria-label="Số lượng" class="cart-quantity w-16 text-center rounded-lg bg-surface-container-low py-1"/>
                  <button type="button" data-action="increase" aria-label="Tăng số lượng" class="px-3 py-1 rounded-lg bg-surface-container"
                          th:disabled="${!item.available or item.quantity >= item.availableStock}">+</button>
                  <button type="button" data-action="remove" class="ml-auto text-primary underline px-2 py-1">Xóa</button>
                </div>
              </div>
              <strong data-line-total class="text-primary" th:text="${#numbers.formatDecimal(item.lineTotal, 0, 'POINT', 0, 'COMMA') + ' ₫'}"></strong>
            </article>
            <a href="/products" class="inline-block py-space-md text-primary">← Tiếp tục chọn bánh</a>
          </div>
          <aside class="lg:col-span-4 bg-white rounded-xl p-space-lg shadow-sm space-y-space-md">
            <h2 class="font-headline-md text-headline-md">Tóm tắt giỏ hàng</h2>
            <p>Tổng số bánh: <strong id="cart-total-quantity" th:text="${cart.totalQuantity}"></strong></p>
            <p class="flex justify-between">Tạm tính: <strong id="cart-total-amount" th:text="${#numbers.formatDecimal(cart.totalAmount, 0, 'POINT', 0, 'COMMA') + ' ₫'}"></strong></p>
            <p class="text-body-sm">Thời gian chuẩn bị tối thiểu: <span id="cart-preparation-days" th:text="${cart.maximumPreparationDays}"></span> ngày</p>
            <p id="cart-checkout-warning" th:style="${cart.checkoutAllowed ? 'display:none' : ''}" role="alert" class="text-primary text-body-sm">Vui lòng giảm số lượng hoặc xóa sản phẩm không còn bán trước khi thanh toán.</p>
            <a id="cart-checkout" th:style="${cart.checkoutAllowed ? '' : 'display:none'}" th:href="${cart.checkoutAllowed ? '/checkout' : null}" class="block text-center rounded-xl py-space-md bg-primary-container text-on-primary">Tiến hành thanh toán</a>
            <button id="cart-checkout-disabled" th:style="${cart.checkoutAllowed ? 'display:none' : ''}" type="button" disabled class="w-full rounded-xl py-space-md bg-primary-container text-on-primary opacity-50">Tiến hành thanh toán</button>
          </aside>
        </div>
      </section>
    </main>
    <script th:src="@{/js/cart.js}" src="/js/cart.js" defer></script>
    <footer th:replace="~{fragments/layout :: storefrontFooter}"></footer>
